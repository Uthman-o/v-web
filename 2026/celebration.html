<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine Secured</title>
  <style>
    :root{
      --bg0:#02110B;
      --bg1:#052217;
      --emerald:#1FD18C;
      --emerald2:#0EA572;
      --text:#EFFFF7;
      --muted:rgba(239,255,247,.72);
      --border: rgba(239,255,247,.14);
      --shadow: 0 18px 60px rgba(0,0,0,.42);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(1000px 700px at 65% 20%, rgba(31,209,140,.22), transparent 60%),
        radial-gradient(800px 620px at 25% 80%, rgba(14,165,114,.18), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow:hidden;
    }

    canvas{
      position:fixed;
      inset:0;
      pointer-events:none;
    }

    /* new: spaced layout */
    .wrap{
      height:100%;
      display:flex;
      align-items:stretch;
      justify-content:center;
      padding: 52px 24px;
    }

    .card{
      width:min(980px, 100%);
      min-height: 82vh;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      box-shadow: var(--shadow);
      padding: clamp(22px, 3vw, 38px);
      position:relative;
      overflow:hidden;

      display:flex;
      flex-direction:column;
      justify-content:space-between;
      text-align:center;
    }

    .top{
      flex: 0 0 auto;
      padding-top: 2px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(239,255,247,.16);
      background: rgba(0,0,0,.18);
      color: rgba(239,255,247,.86);
      font-weight: 900;
      letter-spacing:.2px;
      font-size: 13px;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background: var(--emerald);
      box-shadow: 0 0 18px rgba(31,209,140,.35);
    }

    .middle{
      flex: 1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px 0;
    }

    .stack{
      width: min(760px, 100%);
      margin: 0 auto;
    }

    h1{
      margin: 0 0 10px;
      font-size: clamp(32px, 5.4vw, 66px);
      font-weight: 980;
      letter-spacing: -1.3px;
      background: linear-gradient(135deg, rgba(31,209,140,1), rgba(239,255,247,.90));
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,.25));
    }

    .sub{
      margin: 0 auto;
      max-width: 62ch;
      color: var(--muted);
      font-size: clamp(14px, 2.2vw, 18px);
      line-height: 1.7;
    }

    .big{
      margin-top: 18px;
      font-size: clamp(18px, 3.2vw, 30px);
      font-weight: 980;
      letter-spacing: -.6px;
      color: rgba(239,255,247,.92);
    }

    .bottom{
      flex: 0 0 auto;
      padding-bottom: 2px;
    }

    .btnrow{
      margin-top: 10px;
      display:flex;
      justify-content:center;
      gap: 14px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 12px 18px;
      border-radius: 14px;
      border: 0;
      cursor: pointer;
      font-weight: 950;
      letter-spacing:.2px;
      color: #02110B;
      background: linear-gradient(135deg, var(--emerald), rgba(239,255,247,.88));
      box-shadow: 0 16px 44px rgba(31,209,140,.22);
      text-decoration:none;
      user-select:none;
      transition: transform .12s ease, box-shadow .12s ease;
      min-width: 200px;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:hover{ box-shadow: 0 20px 56px rgba(31,209,140,.26); }

    .btn-ghost{
      color: rgba(239,255,247,.90);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(239,255,247,.18);
      box-shadow: none;
      min-width: 200px;
    }
    .btn-ghost:hover{
      background: rgba(255,255,255,.09);
      border-color: rgba(239,255,247,.24);
      box-shadow: none;
    }

    .fine{
      margin-top: 14px;
      color: rgba(239,255,247,.55);
      font-size: 12.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
    }

    @media (max-width: 520px){
      .wrap{ padding: 36px 16px; }
      .card{ min-height: 86vh; }
      .btn{ min-width: 100%; }
      .btn-ghost{ min-width: 100%; }
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>

  <main class="wrap">
    <section class="card" aria-label="Celebration">
      <!-- TOP -->
      <div class="top">
        <div class="badge"><span class="dot"></span> Status: Valentine Secured</div>
      </div>

      <!-- MIDDLE -->
      <div class="middle">
        <div class="stack">
          <h1 id="headline">YES detected.</h1>

          <p class="sub">
            Request accepted with <b>zero hesitation</b> (okay maybe one millisecond).
            System is now running in <b>girlfriend-approved mode</b>.
          </p>

          <div class="big" id="bigline">Valentine secured. Mission accomplished.</div>
        </div>
      </div>

      <!-- BOTTOM -->
      <div class="bottom">
        <div class="btnrow">
          <a class="btn" href="./carried_away.html" aria-label="Continue">
            Continue
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M10 19l7-7-7-7" stroke="rgba(2,17,11,.9)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>

          <button class="btn btn-ghost" id="replay" type="button" aria-label="Replay confetti">
            Replay confetti
          </button>

          <button class="btn btn-ghost" id="audioToggle" type="button" aria-label="Play or pause music">
            Play music
          </button>


        </div>
        
        <audio id="bgm" preload="auto" loop>
          <source src="sunshine-cute-baby.mp3" type="audio/mpeg" />
        </audio>
        <div class="fine">Log: commit("us") ✅ • push("forever-ish") ✅</div>
      </div>
    </section>
  </main>

  <script>
    // ----- HARD GATE: one-time entry only -----
    (function gateCelebration(){
      const key = "val_celebrate_unlock";
      const token = sessionStorage.getItem(key);

      if (!token) {
        window.location.replace("./ask.html");
        return;
      }

      // consume immediately (single-use)
      sessionStorage.removeItem(key);
      history.replaceState(null, "", location.href);
    })();


    // ----- Personalize with ?name= -----
    const params = new URLSearchParams(window.location.search);
    const name = (params.get('name') || "").trim();
    const headline = document.getElementById('headline');
    const bigline = document.getElementById('bigline');

    if (name){
      headline.textContent = name + " said YES.";
      bigline.textContent = "Valentine secured. Mission accomplished.";
    }

    // ----- Confetti (emerald + light) -----
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');

    function resize(){
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    }
    window.addEventListener('resize', resize);
    resize();

    const colors = [
      "rgba(31,209,140,.95)",
      "rgba(14,165,114,.95)",
      "rgba(239,255,247,.92)",
      "rgba(239,255,247,.55)"
    ];

    let pieces = [];
    const N = 190;

    function rand(min,max){ return min + Math.random()*(max-min); }

    function spawn(){
      pieces = [];
      for(let i=0;i<N;i++){
        pieces.push({
          x: rand(0, window.innerWidth),
          y: rand(-window.innerHeight, 0),
          w: rand(6, 12),
          h: rand(8, 18),
          vx: rand(-0.6, 0.6),
          vy: rand(1.4, 3.6),
          rot: rand(0, Math.PI*2),
          vr: rand(-0.08, 0.08),
          c: colors[Math.floor(Math.random()*colors.length)],
          type: Math.random() < 0.24 ? "heart" : "rect"
        });
      }
    }

    function drawHeart(x,y,s,rot,color){
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(rot);
      ctx.scale(s,s);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.bezierCurveTo(0, -2, -10, -2, -10, 6);
      ctx.bezierCurveTo(-10, 12, -3, 16, 0, 20);
      ctx.bezierCurveTo(3, 16, 10, 12, 10, 6);
      ctx.bezierCurveTo(10, -2, 0, -2, 0, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function step(){
      ctx.clearRect(0,0,window.innerWidth,window.innerHeight);

      for (const p of pieces){
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;

        if (p.y > window.innerHeight + 30){
          p.y = rand(-160, -20);
          p.x = rand(0, window.innerWidth);
        }
        if (p.x < -30) p.x = window.innerWidth + 30;
        if (p.x > window.innerWidth + 30) p.x = -30;

        if (p.type === "rect"){
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
          ctx.restore();
        } else {
          drawHeart(p.x, p.y, 0.5 + p.w/18, p.rot, p.c);
        }
      }

      requestAnimationFrame(step);
    }

    spawn();
    step();

    document.getElementById('replay').addEventListener('click', () => {
      spawn();
    });

      // ----- Music (MP3) + Play/Pause -----
  const bgm = document.getElementById('bgm');
  const audioToggle = document.getElementById('audioToggle');

  function setAudioBtn(){
    audioToggle.textContent = bgm.paused ? "Play music" : "Pause music";
  }

  async function tryPlay(){
    try{
      await bgm.play();
    }catch(e){
      // Autoplay may be blocked until user interacts; ignore.
    }
    setAudioBtn();
  }

  // Try to start music on first user interaction (required by most browsers)
  window.addEventListener('pointerdown', tryPlay, { once: true });

  audioToggle.addEventListener('click', async () => {
    if (bgm.paused){
      await tryPlay();
    } else {
      bgm.pause();
      setAudioBtn();
    }
  });

  setAudioBtn();

  </script>
</body>
</html>
