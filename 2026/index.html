<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — Valentine Not Found</title>
  <style>
    :root{
      --bg0:#02110B;
      --bg1:#052217;
      --emerald:#1FD18C;
      --emerald2:#0EA572;
      --text:#EFFFF7;
      --muted:rgba(239,255,247,.72);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 600px at 70% 25%, rgba(31,209,140,.22), transparent 60%),
        radial-gradient(700px 520px at 25% 75%, rgba(14,165,114,.18), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow:hidden;
    }

    /* soft floating hearts (subtle, emerald) */
    .hearts{ position:fixed; inset:0; pointer-events:none; opacity:.22; }
    .heart{
      position:absolute;
      width:14px; height:14px;
      transform: rotate(45deg);
      border-radius:3px;
      background: linear-gradient(135deg, rgba(31,209,140,.95), rgba(31,209,140,.55));
      animation: floatUp linear infinite;
    }
    .heart:before,.heart:after{
      content:"";
      position:absolute;
      width:14px; height:14px;
      border-radius:50%;
      background: inherit;
      top:-7px; left:0;
    }
    .heart:after{ top:0; left:-7px; }
    @keyframes floatUp{
      from{ transform: translateY(60px) rotate(45deg) scale(1); opacity:0; }
      12%{ opacity:1; }
      to{ transform: translateY(-120vh) rotate(45deg) scale(1.25); opacity:0; }
    }

    .wrap{
      height:100%;
      display:grid;
      place-items:center;
      padding: 24px;
    }

    .center{
      text-align:center;
      max-width: 820px;
      padding: 28px 18px;
      position:relative;
    }

    .code{
      font-size: clamp(72px, 10vw, 140px);
      font-weight: 900;
      line-height: 1;
      margin: 0;
      letter-spacing: -2px;
      background: linear-gradient(135deg, rgba(31,209,140,1), rgba(239,255,247,.85));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,.35));
    }

    h1{
      margin: 10px 0 6px;
      font-size: clamp(22px, 3.2vw, 34px);
      font-weight: 800;
      letter-spacing: -.3px;
    }

    p{
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 2vw, 18px);
      line-height: 1.55;
    }

    .countwrap{
      margin-top: 18px;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
    }

    .countlabel{
      color: rgba(239,255,247,.82);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .2px;
    }

    .countbox{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(239,255,247,.16);
      background: rgba(239,255,247,.06);
      backdrop-filter: blur(6px);
    }

    .unit{
      min-width: 92px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid rgba(239,255,247,.10);
      background: rgba(0,0,0,.12);
    }

    .num{
      font-weight: 900;
      font-size: 24px;
      line-height: 1;
      background: linear-gradient(135deg, var(--emerald), rgba(239,255,247,.95));
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.22));
    }

    .lbl{
      margin-top: 6px;
      font-size: 12px;
      color: rgba(239,255,247,.70);
      letter-spacing: .35px;
      text-transform: uppercase;
    }

    .btn{
      margin-top: 14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 12px 18px;
      border-radius: 14px;
      border: 0;
      cursor: pointer;
      font-weight: 800;
      letter-spacing:.2px;
      color: #02110B;
      background: linear-gradient(135deg, var(--emerald), rgba(239,255,247,.88));
      box-shadow: 0 14px 34px rgba(31,209,140,.18);
      text-decoration:none;
      transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
      user-select:none;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:hover{ box-shadow: 0 18px 44px rgba(31,209,140,.22); }

    /* subtle corner glow */
    .glow{
      position:fixed;
      inset:auto -180px -180px auto;
      width: 520px; height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(31,209,140,.22), transparent 62%);
      filter: blur(2px);
      pointer-events:none;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(239,255,247,.16);
      background: rgba(0,0,0,.22);
      color: rgba(239,255,247,.86);
      font-size: 13px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .25s ease, transform .25s ease;
      text-align:center;
      max-width: min(520px, calc(100% - 40px));
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    /* --- Innovative "find continue" --- */
    .scanner-wrap{
      margin-top: 14px;
      display:flex;
      justify-content:center;
    }
    .scanner{
      width:min(520px, 100%);
      border-radius: 18px;
      border: 1px solid rgba(239,255,247,.14);
      background: rgba(0,0,0,.18);
      overflow:hidden;
      position:relative;
      padding: 14px 14px 16px;
    }
    .scanner-wrap{
      display: none;
    }
    .scanner-wrap.show{
      display: flex;
    }
    .scan-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      font-size: 12.5px;
      color: rgba(239,255,247,.75);
    }
    .scanbar{
      height: 10px;
      border-radius: 999px;
      background: rgba(239,255,247,.10);
      overflow:hidden;
      position:relative;
    }
    .scanbar > i{
      display:block;
      height:100%;
      width: 28%;
      background: linear-gradient(90deg, rgba(31,209,140,.0), rgba(31,209,140,.95), rgba(31,209,140,.0));
      transform: translateX(-120%);
    }

    .scan-msg{
      margin-top: 10px;
      font-size: 13.5px;
      color: rgba(239,255,247,.70);
      line-height: 1.45;
    }

    /* hidden continue link revealed */
    .continue{
      margin-top: 12px;
      display:none;
      opacity:0;
      transform: translateY(6px);
      transition: opacity .35s ease, transform .35s ease;
    }
    .continue.show{
      display:inline-flex;
      opacity:1;
      transform: translateY(0);
    }

    /* tiny "easter egg" scan target */
    .ghost-target{
      position:absolute;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      left: 12px;
      top: 12px;
      opacity:0;
      cursor: crosshair;
      border:0;
      background:transparent;
    }

    @media (max-width: 520px){
      .unit{ min-width: 82px; }
    }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true" id="hearts"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="wrap">
    <section class="center" role="main" aria-label="404 page">
      <p class="code">404</p>
      <h1>Oops — Valentine not found.</h1>
      <p>The person you’re looking for doesn’t exist yet.</p>

      <!-- Countdown -->
      <div class="countwrap" aria-label="Countdown to February 14 (ET)">
        <div class="countlabel">Time left to find one:</div>
        <div class="countbox" role="timer" aria-live="polite">
          <div class="unit"><div class="num" id="d">--</div><div class="lbl">Days</div></div>
          <div class="unit"><div class="num" id="h">--</div><div class="lbl">Hours</div></div>
          <div class="unit"><div class="num" id="m">--</div><div class="lbl">Minutes</div></div>
          <div class="unit"><div class="num" id="s">--</div><div class="lbl">Seconds</div></div>
        </div>
      </div>

      <!-- HELP button (moved under countdown) -->
      <button class="btn" id="helpBtn" type="button" aria-label="Help">
        Help
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 18h.01" stroke="rgba(2,17,11,.9)" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M9.1 9a3 3 0 1 1 4.9 2.6c-.9.5-1.5 1.3-1.5 2.4v.5"
                stroke="rgba(2,17,11,.9)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z"
                stroke="rgba(2,17,11,.9)" stroke-width="2.0" opacity=".8"/>
        </svg>
      </button>

      <!-- Innovative continue finder: "Valentine Scanner" -->
      <div class="scanner-wrap">
        <div class="scanner" aria-label="Valentine scanner">
          <button class="ghost-target" id="ghost" aria-label="Hidden scan target"></button>

          <div class="scan-top">
            <span>val_finder.scan()</span>
            <span id="scanState">IDLE</span>
          </div>

          <div class="scanbar" aria-hidden="true"><i id="scanBeam"></i></div>

          <div class="scan-msg" id="scanMsg">
            To unlock the next step, run a scan.<br/>
            Tip: the scanner only reacts to <b>honest hover</b>.
          </div>

          <!-- Links to ask.html (ask.html is password-protected) -->
          <a class="btn continue" id="continueBtn" href="./ask.html" aria-label="Continue to ask page">
            Continue
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M10 19l7-7-7-7" stroke="rgba(2,17,11,.9)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // hearts
    (function(){
      const root = document.getElementById('hearts');
      const count = 14;
      for(let i=0;i<count;i++){
        const h = document.createElement('div');
        h.className = 'heart';
        const left = Math.random()*100;
        const size = 9 + Math.random()*16;
        const dur  = 10 + Math.random()*16;
        const delay= Math.random()*6;

        h.style.left = left + 'vw';
        h.style.bottom = (-10 - Math.random()*30) + 'vh';
        h.style.width = size + 'px';
        h.style.height = size + 'px';
        h.style.animationDuration = dur + 's';
        h.style.animationDelay = delay + 's';
        h.style.opacity = (0.10 + Math.random()*0.22).toFixed(2);

        root.appendChild(h);
      }
    })();

    // Countdown to Feb 14 00:00 ET (robust via Intl offset iteration)
    const $d = document.getElementById('d');
    const $h = document.getElementById('h');
    const $m = document.getElementById('m');
    const $s = document.getElementById('s');
    const tz = "America/New_York";

    function epochFromET(y, mon, day, hour, min, sec){
      let guess = Date.UTC(y, mon, day, hour, min, sec);
      for(let i=0;i<6;i++){
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: tz,
          year:"numeric", month:"2-digit", day:"2-digit",
          hour:"2-digit", minute:"2-digit", second:"2-digit",
          hour12:false
        }).formatToParts(new Date(guess));
        const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
        const etAsUTC = Date.UTC(+map.year, +map.month-1, +map.day, +map.hour, +map.minute, +map.second);
        const offset = etAsUTC - guess;
        guess = guess + offset;
        if (Math.abs(offset) < 500) break;
      }
      return guess;
    }

    function getTargetEpochMs(){
      const now = new Date();
      const year = now.getUTCFullYear();
      let t = epochFromET(year, 1, 14, 0, 0, 0);   // Feb=1
      if (Date.now() >= t) t = epochFromET(year + 1, 1, 14, 0, 0, 0);
      return t;
    }

    const target = getTargetEpochMs();
    function pad2(n){ return String(n).padStart(2,'0'); }

    function tick(){
      const diff = Math.max(0, target - Date.now());
      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      $d.textContent = days;
      $h.textContent = pad2(hours);
      $m.textContent = pad2(mins);
      $s.textContent = pad2(secs);
    }
    tick();
    setInterval(tick, 1000);

    // Toast
    const toast = document.getElementById('toast');
    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=>toast.classList.remove('show'), 2400);
    }

    // Help button
    const scannerWrap = document.querySelector('.scanner-wrap');
    let armed=false;

    document.getElementById('helpBtn').addEventListener('click', () => {
      showToast("Hint: If you're not Dulcinea, keep searching. Also… maybe try scanning 👀");
      scannerWrap.classList.add('show');

      armed =false;
      scanState.textContent= "IDLE";
      scanMsg.innerHTML= "Move your mouse over the scanner to begin.";

      const armOnce = () => { armed = true; };
      document.addEventListener('mousemove', armOnce, { once: true });
    });

    // document.addEventListener('mousemove', () => {
    //     armed = true;
    //   }, { once: true });



    // Scan to reveal Continue
    const scanner = document.querySelector('.scanner');
    const scanBeam = document.getElementById('scanBeam');
    const scanState = document.getElementById('scanState');
    const scanMsg = document.getElementById('scanMsg');
    const continueBtn = document.getElementById('continueBtn');
    const ghost = document.getElementById('ghost');

    let scanning = false;
    let progress = 0;
    let rafId = null;

    function setBeam(x){ scanBeam.style.transform = `translateX(${x}%)`; }

    function revealContinue(){
      continueBtn.classList.add('show');
      scanState.textContent = "DONE";
      scanMsg.innerHTML = "Scan complete.<br/><b>Match found.</b> Proceed before the system changes its mind.";
      showToast("Scan complete ✅ Continue unlocked.");
    }

    function animateScan(){
      if (!scanning) return;
      progress = Math.min(100, progress + 0.8);
      const beamX = -120 + (progress * 4.5);
      setBeam(beamX);

      if (progress >= 100){
        scanning = false;
        revealContinue();
        return;
      }
      rafId = requestAnimationFrame(animateScan);
    }

    scanner.addEventListener('mouseenter', () => {
      if (!armed) return;
      if (continueBtn.classList.contains('show')) return;

      scanning = true;
      scanState.textContent = "SCANNING";
      scanMsg.innerHTML =
        "Scanning for a valid Valentine…<br/>Hold steady. Don’t blink. (Okay blink, just stay here.)";

      if (!rafId) rafId = requestAnimationFrame(animateScan);
    });


    scanner.addEventListener('mouseleave', () => {
      if (!armed) return;
      if (continueBtn.classList.contains('show')) return;

      scanning = false;
      scanState.textContent = "PAUSED";
      scanMsg.innerHTML = "Scan paused.<br/>Reason: user fled the scene.";

      progress = Math.max(0, progress - 18);
      setBeam(-120 + (progress * 2.2));

      if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    });


    // Easter egg: invisible corner target instantly unlocks
    ghost.addEventListener('click', () => {
      if (continueBtn.classList.contains('show')) return;
      progress = 100;
      setBeam(100);
      revealContinue();
      showToast("Developer mode activated. (How did you even find that?)");
    });
  </script>
</body>
</html>
