<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treasure Hunt</title>

  <style>
    :root{
      --bg-1:#160B14;
      --bg-2:#2A0F1C;
      --hl:#F2C6B6;

      --card: rgba(255,255,255,0.12);
      --card2: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.20);

      --text:#F8F6F7;
      --muted: rgba(248,246,247,0.72);
      --accent:#FFD6A5;

      --btn1:#8A1538;
      --btn2:#C93A6A;

      --ok:#3ddc97;
      --bad:#ff6b6b;
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(242,198,182,0.22), transparent 55%),
        radial-gradient(900px 500px at 80% 80%, rgba(201,58,106,0.18), transparent 55%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px;
    }

    .shell{ width: min(1100px, 96vw); }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      overflow:hidden;
    }

    .topbar{
      padding: clamp(16px, 2.5vw, 22px);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
    }

    .title{
      margin:0;
      font-size: clamp(1.6rem, 3.2vw, 2.3rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .subtitle{
      margin: 8px 0 0 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.8vw, 1.05rem);
      line-height: 1.45;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.88);
      font-weight: 650;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .layout{
      display:grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      min-height: 560px;
    }

    @media (max-width: 900px){
      .layout{ grid-template-columns: 1fr; }
      .side{ border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.12); }
    }

    .side{
      padding: 18px;
      background: var(--card2);
      border-right: 1px solid rgba(255,255,255,0.12);
    }

    .progressWrap{
      display:flex;
      flex-direction:column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .progressLabel{
      display:flex;
      align-items:center;
      justify-content:space-between;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .bar{
      width:100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.10);
      overflow:hidden;
    }

    .bar > div{
      height:100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--btn1), var(--btn2));
      transition: width 300ms ease;
    }

    .steps{
      display:flex;
      flex-direction:column;
      gap: 10px;
      margin-top: 10px;
    }

    .step{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 12px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
    }

    .step.active{
      border-color: rgba(255,214,165,0.40);
      background: rgba(255,214,165,0.10);
    }

    .dot{
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.20);
      border: 1px solid rgba(255,255,255,0.18);
      flex: 0 0 auto;
    }

    .step.done .dot{
      background: rgba(61,220,151,0.9);
      border-color: rgba(61,220,151,0.6);
      box-shadow: 0 0 0 6px rgba(61,220,151,0.12);
    }

    .stepTitle{
      font-weight: 750;
      letter-spacing: -0.01em;
      font-size: 0.98rem;
      margin: 0;
    }

    .stepMeta{
      margin: 2px 0 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .main{ padding: clamp(18px, 2.8vw, 28px); }

    .panel{
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.16);
      border-radius: 22px;
      padding: clamp(16px, 2.5vw, 22px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .clueHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    .clueName{
      margin:0;
      font-size: clamp(1.2rem, 2.2vw, 1.55rem);
      letter-spacing: -0.02em;
    }

    .clueText{
      margin: 10px 0 14px 0;
      color: rgba(255,255,255,0.88);
      font-size: clamp(1rem, 1.9vw, 1.08rem);
      line-height: 1.55;
      white-space: pre-line;
    }

    .inputRow{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      align-items:center;
      margin-top: 8px;
    }

    input{
      flex: 1 1 260px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.22);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    input:focus{
      border-color: rgba(255,214,165,0.45);
      box-shadow: 0 0 0 4px rgba(255,214,165,0.14), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .btn{
      border:none;
      cursor:pointer;
      border-radius: 16px;
      padding: 12px 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      font-size: 1rem;
      user-select:none;
      white-space: nowrap;
    }

    .btnPrimary{
      color: white;
      background: linear-gradient(135deg, var(--btn1), var(--btn2));
      box-shadow: 0 10px 26px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.22);
      transition: transform 160ms ease, filter 200ms ease, box-shadow 200ms ease;
    }

    .btnPrimary:hover{
      transform: translateY(-2px);
      filter: brightness(1.04);
      box-shadow: 0 14px 34px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .btnGhost{
      color: rgba(255,255,255,0.92);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform 160ms ease, background 200ms ease;
    }

    .btnGhost:hover{
      transform: translateY(-2px);
      background: rgba(255,255,255,0.11);
    }

    .hint{
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,214,165,0.25);
      background: rgba(255,214,165,0.08);
      color: rgba(255,255,255,0.92);
      display:none;
      line-height: 1.4;
      white-space: pre-line;
    }

    .feedback{
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.9);
      display:none;
      line-height: 1.4;
    }

    .feedback.ok{
      border-color: rgba(61,220,151,0.35);
      background: rgba(61,220,151,0.10);
    }

    .feedback.bad{
      border-color: rgba(255,107,107,0.35);
      background: rgba(255,107,107,0.10);
    }

    .footer{
      padding: 14px 18px;
      border-top: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.58);
      font-size: 0.92rem;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      flex-wrap:wrap;
      background: linear-gradient(0deg, rgba(0,0,0,0.18), transparent);
    }

    @media (prefers-reduced-motion: reduce){
      .bar > div, .btnPrimary, .btnGhost { transition: none; }
    }
  </style>
</head>

<body>
  <div class="shell">
    <div class="card">
      <div class="topbar">
        <div>
          <h1 class="title">Treasure Hunt</h1>
          <p class="subtitle">Answer each clue to unlock the final surprise.</p>
        </div>
        <div class="badge" id="statusBadge">Step 1 of 4</div>
      </div>

      <div class="layout">
        <aside class="side">
          <div class="progressWrap">
            <div class="progressLabel">
              <span>Progress</span>
              <span id="progressPct">0%</span>
            </div>
            <div class="bar"><div id="barFill"></div></div>
          </div>

          <div class="steps">
            <div class="step active" id="step1">
              <div class="dot"></div>
              <div>
                <p class="stepTitle">Clue #1</p>
                <p class="stepMeta">Where it began</p>
              </div>
            </div>

            <div class="step" id="step2">
              <div class="dot"></div>
              <div>
                <p class="stepTitle">Clue #2</p>
                <p class="stepMeta">A first tune</p>
              </div>
            </div>

            <div class="step" id="step3">
              <div class="dot"></div>
              <div>
                <p class="stepTitle">Clue #3</p>
                <p class="stepMeta">A favorite detail</p>
              </div>
            </div>

            <div class="step" id="step4">
              <div class="dot"></div>
              <div>
                <p class="stepTitle">Clue #4</p>
                <p class="stepMeta">A dream destination</p>
              </div>
            </div>
          </div>
        </aside>

        <main class="main">
          <div class="panel">
            <div class="clueHeader">
              <h2 class="clueName" id="clueTitle">Clue #1</h2>
              <button class="btn btnGhost" id="hintBtn" type="button">Show hint</button>
            </div>

            <div class="clueText" id="clueBody"></div>

            <div class="inputRow">
              <input id="answerInput" type="text" autocomplete="off" spellcheck="false" />
              <button class="btn btnPrimary" id="submitBtn" type="button">Submit</button>
            </div>

            <div class="hint" id="hintBox"></div>
            <div class="feedback" id="feedbackBox"></div>
          </div>
        </main>
      </div>

      <div class="footer">
        <span>Valentine Mission • 2025</span>
        <span>Progress must be earned.</span>
      </div>
    </div>
  </div>

  <script>
    if (!sessionStorage.getItem("visited_takeoff")) {
      alert("You must go through the previous page first!");
      window.location.href = "index.html";
    }

    const CLUES = [
      {
        title: "Clue #1",
        body:
`I am the place where journeys begin,
Unbrought gifts, awkward hugs, emotional goodbyes.
When did we first meet? (MM/DD/YYYY)`,
        placeholder: "MM/DD/YYYY",
        hint: "Hint: remember that special day in the coffee shop..."
      },
      {
        title: "Clue #2",
        body:
`The first tune you sent my way,
A melody that brightened my day.
What song began our musical ride?`,
        placeholder: "Enter first word",
        hint: "Hint: “I hate confrontation, it makes me uncomfortable...”"
      },
      {
        title: "Clue #3",
        body:
`Soft as silk, a gentle trace,
Where my fingers love to embrace.
What's my favorite part of you?`,
        placeholder: "Five letters",
        hint: "Hint: exactly what you think..."
      },
      {
        title: "Clue #4",
        body:
`Cherry blossoms in the springtime air,
Temples, sushi, lights everywhere.
If dreams came true and money could flow,
Where would we pack our bags to go?`,
        placeholder: "Five letters",
        hint: "Hint: remember that “therapy session” joke..."
      }
    ];

    const ANSWER_HASHES = [
      "c5c1ddbcbce103af5b0edffaa77d82958b69cb8492e572dd1b5a75a85e6f8aba",
      "c9022680f888674e2b2274758755bfa07dea729b68d71cde5c521ed70ef261bf",
      "7e85c676fd97d370e2309003a5681bc4388306979b7db04c37c6fb0672891b6a",
      "59ae856cd788d0f57e39fdd66d421ba930cd89be4682de3aa36c22a2021a710d"
    ];

    let step = 0;

    const clueTitle = document.getElementById("clueTitle");
    const clueBody  = document.getElementById("clueBody");
    const answerInput = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    const hintBtn = document.getElementById("hintBtn");
    const hintBox = document.getElementById("hintBox");
    const feedbackBox = document.getElementById("feedbackBox");
    const barFill = document.getElementById("barFill");
    const progressPct = document.getElementById("progressPct");
    const statusBadge = document.getElementById("statusBadge");

    function normalize(s){
      return (s || "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    async function sha256Hex(text){
      const data = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest("SHA-256", data);
      return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,"0")).join("");
    }

    function setStepUI(idx){
      for (let i=1;i<=4;i++){
        const el = document.getElementById("step"+i);
        el.classList.remove("active");
      }
      document.getElementById("step"+(idx+1)).classList.add("active");

      clueTitle.textContent = CLUES[idx].title;
      clueBody.textContent = CLUES[idx].body;

      answerInput.value = "";
      answerInput.type = (idx === 2) ? "password" : "text";
      answerInput.placeholder = CLUES[idx].placeholder;

      hintBox.style.display = "none";
      hintBox.textContent = CLUES[idx].hint;

      feedbackBox.style.display = "none";
      feedbackBox.textContent = "";
      feedbackBox.classList.remove("ok","bad");

      const pct = Math.round((idx / 4) * 100);
      barFill.style.width = pct + "%";
      progressPct.textContent = pct + "%";
      statusBadge.textContent = `Step ${idx+1} of 4`;

      setTimeout(() => answerInput.focus(), 50);
    }

    function markDone(idx){
      document.getElementById("step"+(idx+1)).classList.add("done");
    }

    function showFeedback(type, msg){
      feedbackBox.style.display = "block";
      feedbackBox.textContent = msg;
      feedbackBox.classList.remove("ok","bad");
      feedbackBox.classList.add(type);
    }

    hintBtn.addEventListener("click", () => {
      hintBox.style.display = "block";
    });

    async function check(){
      const input = normalize(answerInput.value);
      if (!input) {
        showFeedback("bad", "Enter an answer.");
        return;
      }

      const hashed = await sha256Hex(input);
      const ok = (hashed === ANSWER_HASHES[step]);

      if (!ok){
        hintBox.style.display = "block";
        showFeedback("bad", "Not quite. Try again.");
        return;
      }

      markDone(step);
      showFeedback("ok", "Correct.");

      step++;

      const pct = Math.round((step / 4) * 100);
      barFill.style.width = pct + "%";
      progressPct.textContent = pct + "%";

      if (step < 4){
        setTimeout(() => setStepUI(step), 500);
      } else {
        statusBadge.textContent = "Completed";
        setTimeout(() => {
          sessionStorage.setItem("visited_th", "true");
          window.location.href = "val_page.html";
        }, 700);
      }
    }

    submitBtn.addEventListener("click", check);
    answerInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") check();
    });

    setStepUI(step);

    // Helper for you if you ever change answers:
    // Open DevTools console and run: debugPrintHash("your answer")
    async function debugPrintHash(plaintext){
      console.log(plaintext, "=>", await sha256Hex(normalize(plaintext)));
    }
  </script>
</body>
</html>
